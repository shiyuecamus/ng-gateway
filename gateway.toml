# General
[general]
# Runtime root directory for all relative paths (./data, ./drivers, ./plugins, ./certs, ...).
#
# Best practice:
# - In Linux packages we rely on systemd `WorkingDirectory=/var/lib/ng-gateway`, so keep this as "."
# - In containers/K8s you can set an absolute path here (or via env) to relocate runtime state.
#
# Environment override:
# - NG__GENERAL__RUNTIME_DIR=/var/lib/ng-gateway
runtime_dir = "."
# ca cert path
ca_cert_path = "ca.crt"
# ca key path
ca_key_path = "ca.key"

# Southward communication configuration
[general.southward]
# API synchronous start wait timeout for driver connection (milliseconds)
start_timeout_ms = 2000

# Southward device snapshot TTL GC (point-level).
#
# This controls how long a point baseline (for ReportType::Change detection) can stay in memory
# without being refreshed by a value change. Expired points will be evicted by a background GC task.
#
# Point baseline TTL in milliseconds. 0 disables eviction.
device_change_cache_ttl_ms = 600000
# Snapshot GC scan interval in milliseconds.
snapshot_gc_interval_ms = 60000
# Number of async snapshot GC workers.
snapshot_gc_workers = 2
# Max devices to scan per snapshot GC tick (bounds CPU usage).
max_devices_per_snapshot_tick = 256

# Northward communication configuration
[general.northward]
# Internal bounded queue capacity for northward manager
queue_capacity = 10000
# API synchronous start wait timeout for northward app (milliseconds)
start_timeout_ms = 2000
# Collector configuration
[general.collector]
# Collection timeout for each device (in milliseconds)
collection_timeout_ms = 30000
# Maximum concurrent collections per channel
max_concurrent_collections = 200
# Optional maximum total elapsed time in milliseconds (omit for no policy limit;
# collector still enforces its own per-group budget)
# max_elapsed_time_ms = 5000
# Outbound queue capacity from collector to gateway (bounded channel)
outbound_queue_capacity = 10000
# Retry policy for failed collections (unified with SDK retry semantics)
[general.collector.retry_policy]
# Maximum number of retries after a failure.
# - max_attempts = 0: no retries
# - max_attempts omitted: unlimited retries (still bounded by collector budget)
max_attempts = 3
# Initial retry interval in milliseconds
initial_interval_ms = 1000
# Maximum retry interval cap in milliseconds
max_interval_ms = 30000
# Randomization factor in range [0.0, 1.0] (e.g. 0.2 means ±20% jitter)
randomization_factor = 0.2
# Multiplicative factor for each retry step (>= 1.0)
multiplier = 2.0

# Logging (top-level)
[logging.control]
channel_override_default_ttl_ms = 300000
channel_override_min_ttl_ms = 10000
channel_override_max_ttl_ms = 1800000
override_cleanup_interval_ms = 5000
driver_ingest_queue_capacity = 10000

[logging.output]
format = "text"               # text | json
include_span_fields = true

[logging.output.file]
enabled = true
dir = "./logs"

[logging.output.file.rotation]
mode = "both"                 # time | size | both
time = "daily"                # hourly | daily
size_mb = 100
max_files = 200

[logging.output.file.retention]
max_days = 7
max_total_size_mb = 2048

[logging.cleanup]
enabled = true
interval_ms = 60000

# Web
[web]
# router prefix
router_prefix = "/api"
# host
host = "0.0.0.0"
# port
port = 5678
# gt 0 use exact number
# 0 use CPU count
# lt 0 use CPU count / abs(workers)
workers = 0

# Web UI (single-container, served by the gateway process)
[web.ui]
# Enable/disable UI serving.
enabled = true
# Mode: embedded_zip | filesystem | disabled
#
# - filesystem: serve from local directory (developer mode / Docker all-in-one)
# - embedded_zip: serve from `ng-gateway-web/ui-dist.zip` compiled into the binary (Homebrew single-binary)
mode = "filesystem"
# Filesystem root directory containing `index.html` and assets (Vite dist output).
filesystem_root = "./ng-gateway-ui/apps/web-antd/dist"

[web.ssl]
# enabled
enabled = true
# port
port = 5679
# type
# auto: generate or load from ca_cert_path and ca_key_path
# local: load from cert and key
type = "auto"
# cert path
cert = "./certs/cert.pem"
# key path
key = "./certs/key.pem"

[web.cors]
# Cros mode
# allow_all, whitelist
mode = "allow_all"

[web.cors.whitelist]
origins = ["*"]
methods = ["GET", "POST", "PUT", "DELETE"]
headers = [
  "Content-Type",
  "AccessToken",
  "X-CSRF-Token",
  "Authorization",
  "Token",
  "X-Token",
  "X-User-Id",
]
expose_headers = [
  "Content-Length",
  "Access-Control-Allow-Origin",
  "Access-Control-Allow-Headers",
  "Content-Type",
]
credentials = true

# JWT
[web.jwt]
# secret
secret = "ng-gateway"
# expire
expire = 3600000
# issuer
issuer = "ng-gateway"

# Cache
[cache]
# type
# only moka is supported
type = "moka"
# prefix
prefix = "ng-gateway"
# delimiter
delimiter = ":"

# Database
[db.sqlite]
# SQLite database file path (resolved under `./data` by default).
path = "ng-gateway.db"
# Connection timeout in milliseconds
timeout = 5000
# Idle timeout in milliseconds
idle_timeout = 5000
# Maximum connection lifetime in milliseconds
max_lifetime = 5000
# Maximum number of connections
max_connections = 100
# Auto create database file if not exists.
# Note: SQLite cannot create parent directories; the gateway will create the data directory at startup.
auto_create = true
