[workspace]
members = [
  "ng-gateway-bin",
  "ng-gateway-storage",
  "ng-gateway-error",
  "ng-gateway-macros",
  "ng-gateway-models",
  "ng-gateway-utils",
  "ng-gateway-web",
  "ng-gateway-common",
  "ng-gateway-repository",
  "ng-gateway-core",
  "ng-gateway-bench",
  "ng-gateway-sdk",
  "ng-gateway-southward/dlt645",
  "ng-gateway-southward/opcua",
  "ng-gateway-southward/iec104",
  "ng-gateway-southward/modbus",
  "ng-gateway-southward/s7",
  "ng-gateway-southward/mc",
  "ng-gateway-southward/dnp3",
  "ng-gateway-southward/cjt188",
  "ng-gateway-southward/ethernet-ip",
  "ng-gateway-northward/thingsboard",
  "ng-gateway-northward/opcua-server",
  "ng-gateway-northward/pulsar",
  "ng-gateway-northward/kafka",
  "ng-gateway-xtask",
]
resolver = "2"

[workspace.package]
authors = ["shiyuecamus <shiyuecamus@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/shiyuecamus/ng-gateway"
version = "0.1.0"
# Minimum Supported Rust Version (MSRV).
# Keep in sync with `rust-toolchain.toml` and the Dockerfile `ARG RUST_VERSION`.
# Declaring this enables Cargo's MSRV-aware dependency resolver (Rust >= 1.84),
# which automatically avoids picking transitive dependency versions whose
# `rust-version` exceeds ours — preventing future MSRV-drift breakages.
rust-version = "1.95"

[patch.crates-io]
# Force all workspace crates (including drivers) to use the local SDK during development.
ng-gateway-sdk = { path = "./ng-gateway-sdk" }

# External NG common api
[workspace.dependencies.node-grove-common-api]
version = "0.0.12"

# Local
[workspace.dependencies.ng-gateway-storage]
path = "./ng-gateway-storage"
[workspace.dependencies.ng-gateway-error]
path = "./ng-gateway-error"
[workspace.dependencies.ng-gateway-utils]
path = "./ng-gateway-utils"
[workspace.dependencies.ng-gateway-models]
path = "./ng-gateway-models"
[workspace.dependencies.ng-gateway-macros]
path = "./ng-gateway-macros"
[workspace.dependencies.ng-gateway-web]
path = "./ng-gateway-web"
[workspace.dependencies.ng-gateway-common]
path = "./ng-gateway-common"
[workspace.dependencies.ng-gateway-repository]
path = "./ng-gateway-repository"
[workspace.dependencies.ng-gateway-core]
path = "./ng-gateway-core"

# Tracing
[workspace.dependencies.tracing]
version = "0.1"
[workspace.dependencies.tracing-subscriber]
version = "0.3"
[workspace.dependencies.tracing-appender]
version = "0.2"

# Command Line Argument Parsing
[workspace.dependencies.clap]
features = ["env"]
version = "4.5"

# Asynchronous Runtime
[workspace.dependencies.tokio]
features = ["full", "tracing"]
version = "1.47"
[workspace.dependencies.tokio-util]
features = ["rt", "io"]
version = "0.7"
[workspace.dependencies.tokio-test]
version = "0.4"
[workspace.dependencies.tokio-stream]
version = "0.1"
[workspace.dependencies.futures]
version = "0.3"
[workspace.dependencies.futures-util]
version = "0.3"
[workspace.dependencies.dashmap]
version = "6.1"

[workspace.dependencies.moka]
version = "0.12"
features = ["sync", "future"]

# Lazy Initialization
[workspace.dependencies.once_cell]
version = "1.20"

# Configuration Management
[workspace.dependencies.config]
default-features = false
features = ["toml"]
version = "0.15"

# Toml
[workspace.dependencies.toml_edit]
version = "0.24"

# Serialization Support
[workspace.dependencies.bytes]
features = ["serde"]
version = "1.9"
[workspace.dependencies.bytestring]
features = ["serde"]
version = "1.4"
[workspace.dependencies.bit-struct]
version = "0.3"
[workspace.dependencies.nom]
version = "8"
[workspace.dependencies.byteorder]
version = "1.5"
[workspace.dependencies.serde]
features = ["derive"]
version = "1.0"
[workspace.dependencies.serde-aux]
version = "4.7"
[workspace.dependencies.serde_with]
version = "3.15"
[workspace.dependencies.serde_json]
version = "1.0"
[workspace.dependencies.serde_repr]
version = "0.1"
[workspace.dependencies.rmp-serde]
version = "1.1"
[workspace.dependencies.downcast-rs]
version = "2.0"

# System Information
[workspace.dependencies.sysinfo]
version = "0.39"

[workspace.dependencies.libc]
version = "0.2"

# Console / Terminal
[workspace.dependencies.colored]
version = "3.0"
[workspace.dependencies.sys-locale]
version = "0.3"
[workspace.dependencies.term_size]
version = "0.3"

# Metrics / Observability
[workspace.dependencies.prometheus]
version = "0.14"

# Error Handling
[workspace.dependencies.thiserror]
version = "2.0"
[workspace.dependencies.anyhow]
version = "1.0"

# Actix
[workspace.dependencies.actix]
version = "0.13"
[workspace.dependencies.actix-web]
features = ["rustls-0_23"]
version = "4.1"
[workspace.dependencies.actix-files]
version = "0.6"
[workspace.dependencies.actix-service]
version = "2.0"
[workspace.dependencies.actix-rt]
version = "2.10"
[workspace.dependencies.actix-tls]
version = "3.4"
[workspace.dependencies.actix-cors]
version = "0.7"
[workspace.dependencies.actix-web-actors]
version = "4.1"
[workspace.dependencies.actix-web-validator]
version = "6.0"
[workspace.dependencies.actix-multipart]
version = "0.7"
[workspace.dependencies.actix-multipart-derive]
version = "0.7"

# Validation
[workspace.dependencies.validator]
features = ["derive"]
version = "0.18.1"

# URL
[workspace.dependencies.url]
features = ["serde"]
version = "2.5"

# JWT
[workspace.dependencies.jsonwebtoken]
version = "9.3"

# Retry backoff
[workspace.dependencies.backoff]
version = "0.4"
features = ["tokio"]

# Casbin
[workspace.dependencies.casbin]
default-features = false
features = ["incremental", "cached", "runtime-tokio", "explain", "logging"]
version = "2.7.0"
[workspace.dependencies.actix-casbin]
default-features = false
features = ["runtime-tokio"]
version = "1.1"
[workspace.dependencies.actix-casbin-auth]
default-features = false
features = ["runtime-tokio"]
version = "1.1"

# WebSockets over Actix (for HTTP upgrade handling in ng-gateway-web)
[workspace.dependencies.actix-ws]
version = "0.4"

# WebSockets over Tokio
[workspace.dependencies.tokio-tungstenite]
version = "0.29"

# gRPC Framework
[workspace.dependencies.tonic]
version = "0.14"
[workspace.dependencies.prost]
version = "0.14"

# Tls
[workspace.dependencies.rustls]
features = ["default", "ring"]
version = "0.23"
[workspace.dependencies.rcgen]
features = ["default", "pem", "x509-parser"]
version = "0.14"
[workspace.dependencies.rustls-pemfile]
version = "2.2"

# Database ORM and Migrations
[workspace.dependencies.sea-orm]
features = [
  "runtime-tokio",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
  "debug-print",
  "serde_json",
  "sea-orm-internal",
  "sqlite-use-returning-for-3_35",
]
version = "1.1"
[workspace.dependencies.sea-orm-migration]
features = ["runtime-tokio", "sqlx-sqlite", "with-chrono", "with-json"]
version = "1.1"
[workspace.dependencies.sea-query]
version = "0.32"

# UUID
[workspace.dependencies.uuid]
features = ["v4", "serde"]
version = "1.11"

# Dynamic Library Loading
[workspace.dependencies.libloading]
version = "0.9"

# Asynchronous Traits
[workspace.dependencies.async-trait]
version = "0.1"

# URL Encoding
[workspace.dependencies.percent-encoding]
version = "2.3"

# Date and Time
[workspace.dependencies.chrono]
version = "0.4"
[workspace.dependencies.time]
version = "0.3"

# macros
[workspace.dependencies.proc-macro2]
version = "1.0"
[workspace.dependencies.syn]
features = ["full"]
version = "2.0"
[workspace.dependencies.quote]
version = "1.0"
[workspace.dependencies.darling]
version = "0.23"

# string operations
[workspace.dependencies.heck]
version = "0.5"

# hashing
[workspace.dependencies.bcrypt]
version = "0.19"
[workspace.dependencies.md-5]
version = "0.11"
[workspace.dependencies.hex]
version = "0.4"

# Random
[workspace.dependencies.rand]
version = "0.10"

# Lock
[workspace.dependencies.parking_lot]
version = "0.12"

# Encoding and Decoding
[workspace.dependencies.base64]
version = "0.22"
[workspace.dependencies.hmac]
version = "0.13"
[workspace.dependencies.sha2]
version = "0.11"

# Protocols
[workspace.dependencies.rumqttc]
features = ["use-rustls"]
version = "0.25"
[workspace.dependencies.tokio-modbus]
default-features = false
features = ["tcp", "rtu"]
version = "0.17"
[workspace.dependencies.tokio-serial]
version = "5.4"
[workspace.dependencies.async-opcua]
features = ["client"]
version = "0.18"

# Atomic Arc swapping for lock-free hot-path reads of session handles
[workspace.dependencies.arc-swap]
version = "1.7"

# File System
[workspace.dependencies.fs2]
version = "0.4"

# Cron scheduler
[workspace.dependencies.tokio-cron-scheduler]
version = "0.15"

# Webpki
[workspace.dependencies.webpki-roots]
version = "1.0"

# Tempfile
[workspace.dependencies.tempfile]
version = "3.11"

# Network
[workspace.dependencies.reqwest]
version = "0.13"
features = ["json", "rustls-native-certs", "stream"]
[workspace.dependencies.surge-ping]
version = "0.8"
[workspace.dependencies.network-interface]
version = "2"
[workspace.dependencies.wifi_scan]
version = "0.7"

# D-Bus (Linux only — used for NetworkManager integration)
[workspace.dependencies.zbus]
version = "5"
default-features = false
features = ["tokio"]

# Memory Allocator
# Use jemalloc as the global allocator on Linux to reduce memory fragmentation
# caused by glibc's default malloc arena strategy (especially in containers).
# The `unprefixed_malloc_on_supported_platforms` feature exports jemalloc's
# malloc/free as global symbols, ensuring cdylib drivers/plugins loaded via
# dlopen also benefit from jemalloc through symbol resolution.
[workspace.dependencies.tikv-jemallocator]
version = "0.6"
features = ["unprefixed_malloc_on_supported_platforms"]

# ═══════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration — ng-gateway
#
# Two-tier strategy:
#   dev     → fast iteration  (compile speed first, deps at O2)
#   release → production      (Full LTO + Os, smallest binary, near-peak perf)
#
# NOTE: Full LTO generates large intermediate artifacts (~50-100 GB).
#       Run `cargo clean --release` periodically to reclaim disk space.
# ═══════════════════════════════════════════════════════════════════════════

# ─── Development ─────────────────────────────────────────────────────────
# Goal: minimize recompile latency while keeping runtime usable for testing.
[profile.dev]
# No optimization for workspace crates → fastest possible compilation.
opt-level = 0
# "line-tables-only" retains backtrace line numbers and breakpoint support
# while skipping expensive DWARF type/variable emission.
# ~30% faster compile + ~40% smaller target/debug than `debug = 2`.
debug = "line-tables-only"
# Incremental compilation: only recompile changed crates (default = true).
incremental = true
# macOS-specific: emit debug info as separate object files, bypassing the
# `dsymutil` merge step which is a known linker bottleneck on large
# workspaces (saves 10-30s per link on this project).
# On Linux this setting is ignored (ELF embeds debug info by default).
split-debuginfo = "unpacked"

# Optimize ALL third-party dependencies at O2 even in dev mode.
# → tokio, actix, serde, rumqttc, sea-orm etc. run at near-release speed
# → Your own 28 workspace crates still compile instantly at O0
# → First full build pays ~60-90s extra; subsequent builds hit cargo cache
# → Eliminates "debug mode is painfully slow" for async I/O and networking
[profile.dev.package."*"]
opt-level = 2
debug = false

# Proc-macros and build scripts execute on the HOST at compile time.
# O3 here accelerates macro expansion (ng-gateway-macros, serde_derive,
# sea-orm derive, clap derive, darling, etc.) → faster overall compilation.
[profile.dev.build-override]
opt-level = 3

# ─── Release ─────────────────────────────────────────────────────────────
# Goal: smallest possible binary with near-peak performance.
# Full LTO + "s" produces aggressive cross-crate DCE and inlining,
# often yielding a binary that is BOTH smaller AND competitive with O3.
[profile.release]
# Optimize for size while preserving near-O2 performance.
# Unlike "z" (which disables inlining entirely), "s" still allows
# profitable inlining and loop optimizations — typically within 2-5%
# of O3 for I/O-bound gateway workloads.
opt-level = "s"
# Single codegen unit per crate — maximizes cross-function optimization
# (inlining, dead-code elimination, constant propagation).
codegen-units = 1
# Full LTO: the linker sees the entire program as one LLVM module,
# enabling maximum dead-code elimination and cross-crate inlining.
lto = true
# Abort on panic: eliminates unwinding tables, landing pads, and the
# personality function from every stack frame. Reduces binary size by
# ~5-10% and removes a branch from every function epilogue.
panic = 'abort'
# Strip symbol table from final binary — no runtime impact.
# Saves ~2-5 MB depending on total symbol count.
strip = "symbols"
# No debug info in release builds — saves significant disk and link time.
debug = false
# Disable incremental compilation in release:
# 1) LTO and incremental are fundamentally incompatible
# 2) Incremental caches produce non-deterministic artifacts
# 3) Prevents stale `.incremental/` dirs from bloating target/
incremental = false

# Proc-macros and build scripts are HOST-side dynamic libraries loaded by
# rustc at compile time. `codegen-units = 1` from the release profile would
# needlessly serialize their compilation. Override to O3 + parallel codegen
# for faster release builds.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
