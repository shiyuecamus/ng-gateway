[package]
name = "ng-gateway-core"
edition = { workspace = true }
publish = { workspace = true }
version = { workspace = true }

# Local
[dependencies.ng-gateway-error]
workspace = true
[dependencies.ng-gateway-storage]
workspace = true
[dependencies.ng-gateway-models]
workspace = true
[dependencies.ng-gateway-common]
workspace = true
[dependencies.ng-gateway-utils]
workspace = true
[dependencies.ng-gateway-repository]
workspace = true
[dependencies.ng-gateway-sdk]
version = "0.1"

# External dependencies
[dependencies.tokio]
workspace = true
[dependencies.tokio-util]
workspace = true
[dependencies.tokio-stream]
workspace = true
[dependencies.futures]
workspace = true
[dependencies.futures-util]
workspace = true
[dependencies.async-trait]
workspace = true
[dependencies.tracing]
workspace = true
[dependencies.uuid]
workspace = true
[dependencies.chrono]
workspace = true
[dependencies.thiserror]
workspace = true
[dependencies.anyhow]
workspace = true
[dependencies.serde]
workspace = true
[dependencies.serde_json]
workspace = true
[dependencies.serde_repr]
workspace = true
[dependencies.bytes]
workspace = true
[dependencies.downcast-rs]
workspace = true
[dependencies.dashmap]
workspace = true
[dependencies.moka]
workspace = true
[dependencies.sea-orm]
workspace = true
[dependencies.libloading]
workspace = true
[dependencies.rand]
workspace = true
[dependencies.base64]
workspace = true
[dependencies.once_cell]
workspace = true
[dependencies.byteorder]
workspace = true
[dependencies.url]
workspace = true
[dependencies.tracing-subscriber]
workspace = true
[dependencies.sha2]
workspace = true
[dependencies.hex]
workspace = true

# Backoff with async/tokio support for unified retry policies
[dependencies.backoff]
workspace = true
# arc-swap for lock-free atomic Arc swapping
[dependencies.arc-swap]
workspace = true
[dependencies.sysinfo]
workspace = true

# Cross-platform network interface enumeration
[dependencies.network-interface]
workspace = true

# Cross-platform Wi-Fi scanning (CoreWLAN on macOS, win32-wlan on Windows, nl80211 on Linux)
[dependencies.wifi_scan]
workspace = true

# D-Bus (Linux only) — NetworkManager integration for Wi-Fi/AP/interface management
[target.'cfg(target_os = "linux")'.dependencies.zbus]
workspace = true
# Config loading (Linux only) — for AP hotspot default config generation from gateway.toml
[target.'cfg(target_os = "linux")'.dependencies.config]
workspace = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]

[target.'cfg(target_os = "macos")'.dependencies]
# CoreWLAN: Wi-Fi STA status, connect, disconnect, scan, saved networks, power management
objc2-core-wlan = { version = "0.3", features = [
    "CWWiFiClient",
    "CWInterface",
    "CWNetwork",
    "CWChannel",
    "CWConfiguration",
    "CWNetworkProfile",
    "CoreWLANTypes",
] }
# Foundation: NSString, NSArray, NSSet, NSData, NSError interop for ObjC bridge
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSSet",
    "NSData",
    "NSError",
    "NSObjCRuntime",
    "NSObject",
    "NSEnumerator",
    "NSOrderedSet",
] }
# objc2 runtime: core ObjC messaging, memory management
objc2 = "0.6"
# SystemConfiguration: BSD-interface → network-service mapping, IP/DNS/Gateway reading
# NOTE: system-configuration 0.7 re-exports core-foundation 0.9 types.
# Do NOT add an explicit core-foundation dep — use the re-export to avoid version conflicts.
system-configuration = "0.7"
