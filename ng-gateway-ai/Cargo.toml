[package]
name = "ng-gateway-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "AI Processing Engine for ng-gateway — model management, inference scheduling, pipeline orchestration"

[features]
default = []
# Full engine implementation: ONNX Runtime, inference pool, pre/post processors, frame decoder, metrics.
# Camera driver (cdylib) should NOT enable this — only the host process (ng-gateway-core) needs it.
engine = [
  "dep:ort",
  "dep:ndarray",
  "dep:image",
  "dep:fast_image_resize",
  "dep:rayon",
  "dep:dashmap",
  "dep:parking_lot",
  "dep:scopeguard",
  "dep:ffmpeg-next",
  "dep:wasmtime",
  "dep:wasmparser",
  "dep:ng-gateway-common",
  "dep:ng-gateway-repository",
  "dep:sea-orm",
]

[dependencies]
# ── Domain types (always available) ─────────────────────────────────
# All public API types, traits, config, and error types live here.
ng-gateway-models.workspace = true
ng-gateway-error.workspace = true
ng-gateway-repository = { workspace = true, optional = true }

# ── Always available (engine internals layer) ───────────────────────
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
bytes.workspace = true
chrono.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs"] }
tokio-util.workspace = true
ng-gateway-common = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
hex.workspace = true
sha2.workspace = true
prost.workspace = true

# ── Engine feature dependencies ─────────────────────────────────────
# Only compiled when the `engine` feature is enabled.
scopeguard = { workspace = true, optional = true }
ort = { workspace = true, features = ["load-dynamic"], optional = true }
ndarray = { workspace = true, optional = true }
image = { workspace = true, default-features = false, features = [
  "jpeg",
  "png",
], optional = true }
fast_image_resize = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ng-gateway-common.workspace = true
criterion.workspace = true

[[bench]]
name = "preprocess_kernel"
harness = false

[[bench]]
name = "postprocess_kernel"
harness = false
