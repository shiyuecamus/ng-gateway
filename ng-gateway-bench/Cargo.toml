[package]
name = "ng-gateway-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
sysinfo = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

ng-gateway-sdk = { workspace = true }

# Southward drivers under test (workspace members)
ng-driver-modbus = { path = "../ng-gateway-southward/modbus" }
ng-driver-opcua = { path = "../ng-gateway-southward/opcua" }
