[package]
name = "ng-gateway-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# IMPORTANT:
# - Southward driver crates export identical `#[no_mangle] create_driver_factory` symbols
#   for dynamic loading as plugins.
# - When a single Rust binary links multiple drivers under LTO (workspace release profile enables LTO),
#   the link step fails due to duplicate symbols.
#
# Therefore, the benchmark tool must link **exactly one** driver at a time.
default = ["modbus"]
modbus = ["dep:ng-driver-modbus"]
opcua = ["dep:ng-driver-opcua"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
sysinfo = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

ng-gateway-sdk = "0.1"
rust_xlsxwriter = "0.93"

# Southward drivers under test (workspace members)
ng-driver-modbus = { path = "../ng-gateway-southward/modbus", optional = true }
ng-driver-opcua = { path = "../ng-gateway-southward/opcua", optional = true }
