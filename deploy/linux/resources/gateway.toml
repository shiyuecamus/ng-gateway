# Default gateway config for Linux deb/rpm distribution.
#
# Key differences vs repo root `gateway.toml`:
# - UI uses `embedded_zip` because Linux packages are built with `ui-embedded` and ship a single
#   binary that can serve UI without any filesystem dist directory.
# - Ports use the product default (8978/8979) to align with Docker and Homebrew distributions.
#
# Note:
# - Many file paths are relative to the process working directory.
# - In Linux packages, systemd sets `WorkingDirectory=/var/lib/ng-gateway`, so keep `runtime_dir="."`.
#

# General
[general]
runtime_dir = "."
ca_cert_path = "ca.crt"
ca_key_path = "ca.key"

# Southward communication configuration
[general.southward]
start_timeout_ms = 5000

# Device snapshot TTL GC (point-level baseline eviction).
device_change_cache_ttl_ms = 600000
snapshot_gc_interval_ms = 60000
snapshot_gc_workers = 2
max_devices_per_snapshot_tick = 256

# Northward communication configuration
[general.northward]
queue_capacity = 10000
start_timeout_ms = 5000

# Collector configuration
[general.collector]
collection_timeout_ms = 30000
max_concurrent_collections = 200
outbound_queue_capacity = 10000

[general.collector.retry_policy]
max_attempts = 3
initial_interval_ms = 1000
max_interval_ms = 30000
randomization_factor = 0.2
multiplier = 2.0
max_elapsed_time_ms = 5000

# Logging (top-level)
[logging.control]
# Default TTL for override leases in milliseconds (applies to channel/app/... scopes).
override_default_ttl_ms = 300000
# Minimum allowed TTL for override leases in milliseconds.
override_min_ttl_ms = 10000
# Maximum allowed TTL for override leases in milliseconds.
override_max_ttl_ms = 1800000
# Background cleanup interval (ms) for expiring override leases.
override_cleanup_interval_ms = 5000
# Unified `cdylib -> host` ingest queue capacity (driver + plugin) (bounded, drop-old-keep-new).
ingest_queue_capacity = 10000

[logging.output]
format = "text"               # text | json
include_span_fields = true

[logging.output.file]
enabled = true
dir = "./logs"

[logging.output.file.rotation]
mode = "both"                 # time | size | both
time = "daily"                # hourly | daily
size_mb = 100
max_files = 200

[logging.output.file.retention]
max_days = 7
max_total_size_mb = 2048

[logging.cleanup]
enabled = true
interval_ms = 60000

# Web
[web]
router_prefix = "/api"
host = "0.0.0.0"
port = 8978
workers = 0

# Web UI (served by the gateway process)
[web.ui]
enabled = true
# Mode: embedded_zip | filesystem | disabled
mode = "embedded_zip"
filesystem_root = "./ng-gateway-ui/apps/web-antd/dist"

[web.ssl]
enabled = true
port = 8979
type = "auto"
cert = "./certs/cert.pem"
key = "./certs/key.pem"

[web.cors]
mode = "allow_all"

[web.cors.whitelist]
origins = ["*"]
methods = ["GET", "POST", "PUT", "DELETE"]
headers = [
  "Content-Type",
  "AccessToken",
  "X-CSRF-Token",
  "Authorization",
  "Token",
  "X-Token",
  "X-User-Id",
]
expose_headers = [
  "Content-Length",
  "Access-Control-Allow-Origin",
  "Access-Control-Allow-Headers",
  "Content-Type",
]
credentials = true

# JWT
[web.jwt]
secret = "ng-gateway"
expire = 3600000
issuer = "ng-gateway"

# Cache
[cache]
type = "moka"
prefix = "ng-gateway"
delimiter = ":"

# Database
[db.sqlite]
path = "ng-gateway.db"
timeout = 5000
idle_timeout = 5000
max_lifetime = 5000
max_connections = 100
auto_create = true
