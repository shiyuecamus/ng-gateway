# E2E Test Infrastructure for AI Vision Pipeline
#
# Provides:
#   - MediaMTX RTSP server with test pattern video source (FFmpeg)
#   - NG Gateway instance with AI engine enabled
#
# Usage:
#   docker compose -f docker-compose.yaml up -d
#   ./run-e2e.sh
#   docker compose -f docker-compose.yaml down -v
#
# The test pattern generator produces a 640x480 RTSP stream at 25fps
# with timestamp overlay, simulating a real IP camera feed.

services:
  # ── RTSP Test Server ────────────────────────────────────────────
  # MediaMTX (formerly rtsp-simple-server): lightweight RTSP/RTMP/HLS server.
  # FFmpeg publishes a synthetic test pattern to it.
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: ng-test-rtsp
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
    environment:
      # Allow any source to publish without authentication.
      MTX_PROTOCOLS: tcp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FFmpeg Test Pattern Generator ───────────────────────────────
  # Generates a color bars + timestamp pattern and publishes to MediaMTX.
  # Produces H.264 baseline profile at 640x480 25fps — matches common IP cameras.
  test-source:
    image: linuxserver/ffmpeg:latest
    container_name: ng-test-ffmpeg
    restart: unless-stopped
    depends_on:
      rtsp-server:
        condition: service_healthy
    entrypoint: >
      ffmpeg
        -re
        -f lavfi -i "testsrc=size=640x480:rate=25,drawtext=text='%{localtime}':fontsize=24:fontcolor=white:x=10:y=10"
        -f lavfi -i "sine=frequency=1000:sample_rate=44100"
        -c:v libx264 -preset ultrafast -tune zerolatency
        -profile:v baseline -level 3.1
        -b:v 1M -maxrate 1M -bufsize 2M
        -g 50 -keyint_min 25
        -pix_fmt yuv420p
        -c:a aac -b:a 64k
        -f rtsp -rtsp_transport tcp
        rtsp://rtsp-server:8554/test-cam

  # ── NG Gateway ──────────────────────────────────────────────────
  gateway:
    image: ${GATEWAY_IMAGE:-shiyuecamus/ng-gateway}:${GATEWAY_TAG:-latest}
    container_name: ng-test-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-5678}:5678"
      - "${GATEWAY_WS_PORT:-5679}:5679"
    volumes:
      - gateway-data:/app/data
      - gateway-drivers:/app/drivers/custom
      - gateway-plugins:/app/plugins/custom
      - gateway-ai:/app/ai
    environment:
      # Enable AI engine
      NG__GENERAL__AI__ENABLED: "true"
      NG__GENERAL__AI__MAX_CONCURRENT_INFERENCES: "4"
      NG__GENERAL__AI__DECODER_WORKERS: "2"
    depends_on:
      rtsp-server:
        condition: service_healthy

volumes:
  gateway-data:
  gateway-drivers:
  gateway-plugins:
  gateway-ai:
