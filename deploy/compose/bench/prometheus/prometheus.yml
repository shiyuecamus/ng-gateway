# =============================================================================
# Prometheus configuration for bench stack (cAdvisor only)
#
# Scrape targets:
#   1. Prometheus self-monitoring
#   2. cAdvisor – container-level CPU / Memory / Network / Disk
# =============================================================================

global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # -- Prometheus self-monitoring --
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # -- cAdvisor (container-level resource metrics) --
  #
  # Provides the same metrics as Kubernetes kubelet/cAdvisor:
  #   - container_cpu_usage_seconds_total
  #   - container_memory_rss / container_memory_cache
  #   - container_network_receive_bytes_total
  #   - container_network_transmit_bytes_total
  #   - container_start_time_seconds
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
