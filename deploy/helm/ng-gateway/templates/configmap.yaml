{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ng-gateway.fullname" . }}-config
  labels:
    {{- include "ng-gateway.gateway.labels" . | nindent 4 }}
data:
{{- $config := .Values.gateway.config -}}
{{- $runtimeEnvEnabled := default false .Values.gateway.runtimeEnv.enabled -}}
  {{- if $config.logLevel }}
  RUST_LOG: {{ $config.logLevel | quote }}
  {{- end }}
  {{- if $config.timezone }}
  TZ: {{ $config.timezone | quote }}
  {{- end }}
  {{- if $config.general }}
  {{- if $config.general.caCertPath }}
  NG__GENERAL__CA_CERT_PATH: {{ $config.general.caCertPath | quote }}
  {{- end }}
  {{- if $config.general.runtimeDir }}
  NG__GENERAL__RUNTIME_DIR: {{ $config.general.runtimeDir | quote }}
  {{- end }}
  {{- if $config.general.caKeyPath }}
  NG__GENERAL__CA_KEY_PATH: {{ $config.general.caKeyPath | quote }}
  {{- end }}
  {{- if $config.general.southward }}
  {{- if $runtimeEnvEnabled }}
  {{- if $config.general.southward.startTimeoutMs }}
  NG__GENERAL__SOUTHWARD__START_TIMEOUT_MS: {{ $config.general.southward.startTimeoutMs | quote }}
  {{- end }}
  {{- if hasKey $config.general.southward "deviceChangeCacheTtlMs" }}
  NG__GENERAL__SOUTHWARD__DEVICE_CHANGE_CACHE_TTL_MS: {{ $config.general.southward.deviceChangeCacheTtlMs | quote }}
  {{- end }}
  {{- if hasKey $config.general.southward "snapshotGcIntervalMs" }}
  NG__GENERAL__SOUTHWARD__SNAPSHOT_GC_INTERVAL_MS: {{ $config.general.southward.snapshotGcIntervalMs | quote }}
  {{- end }}
  {{- if hasKey $config.general.southward "snapshotGcWorkers" }}
  NG__GENERAL__SOUTHWARD__SNAPSHOT_GC_WORKERS: {{ $config.general.southward.snapshotGcWorkers | quote }}
  {{- end }}
  {{- if hasKey $config.general.southward "maxDevicesPerSnapshotTick" }}
  NG__GENERAL__SOUTHWARD__MAX_DEVICES_PER_SNAPSHOT_TICK: {{ $config.general.southward.maxDevicesPerSnapshotTick | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.general.northward }}
  {{- if $runtimeEnvEnabled }}
  {{- if $config.general.northward.queueCapacity }}
  NG__GENERAL__NORTHWARD__QUEUE_CAPACITY: {{ $config.general.northward.queueCapacity | quote }}
  {{- end }}
  {{- if $config.general.northward.startTimeoutMs }}
  NG__GENERAL__NORTHWARD__START_TIMEOUT_MS: {{ $config.general.northward.startTimeoutMs | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.general.collector }}
  {{- if $runtimeEnvEnabled }}
  {{- if $config.general.collector.collectionTimeout }}
  NG__GENERAL__COLLECTOR__COLLECTION_TIMEOUT_MS: {{ $config.general.collector.collectionTimeout | quote }}
  {{- end }}
  {{- if $config.general.collector.maxConcurrentCollections }}
  NG__GENERAL__COLLECTOR__MAX_CONCURRENT_COLLECTIONS: {{ $config.general.collector.maxConcurrentCollections | quote }}
  {{- end }}
  {{- if $config.general.collector.retryPolicy }}
  {{- if hasKey $config.general.collector.retryPolicy "maxAttempts" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__MAX_ATTEMPTS: {{ $config.general.collector.retryPolicy.maxAttempts | quote }}
  {{- end }}
  {{- if hasKey $config.general.collector.retryPolicy "initialIntervalMs" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__INITIAL_INTERVAL_MS: {{ $config.general.collector.retryPolicy.initialIntervalMs | quote }}
  {{- end }}
  {{- if hasKey $config.general.collector.retryPolicy "maxIntervalMs" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__MAX_INTERVAL_MS: {{ $config.general.collector.retryPolicy.maxIntervalMs | quote }}
  {{- end }}
  {{- if hasKey $config.general.collector.retryPolicy "randomizationFactor" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__RANDOMIZATION_FACTOR: {{ $config.general.collector.retryPolicy.randomizationFactor | quote }}
  {{- end }}
  {{- if hasKey $config.general.collector.retryPolicy "multiplier" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__MULTIPLIER: {{ $config.general.collector.retryPolicy.multiplier | quote }}
  {{- end }}
  {{- if hasKey $config.general.collector.retryPolicy "maxElapsedTimeMs" }}
  NG__GENERAL__COLLECTOR__RETRY_POLICY__MAX_ELAPSED_TIME_MS: {{ $config.general.collector.retryPolicy.maxElapsedTimeMs | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.general.collector.outboundQueueCapacity }}
  NG__GENERAL__COLLECTOR__OUTBOUND_QUEUE_CAPACITY: {{ $config.general.collector.outboundQueueCapacity | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.logging }}
  {{- if $config.logging.control }}
  {{- if $runtimeEnvEnabled }}
  {{- if hasKey $config.logging.control "overrideDefaultTtlMs" }}
  NG__LOGGING__CONTROL__OVERRIDE_DEFAULT_TTL_MS: {{ $config.logging.control.overrideDefaultTtlMs | quote }}
  {{- end }}
  {{- if hasKey $config.logging.control "overrideMinTtlMs" }}
  NG__LOGGING__CONTROL__OVERRIDE_MIN_TTL_MS: {{ $config.logging.control.overrideMinTtlMs | quote }}
  {{- end }}
  {{- if hasKey $config.logging.control "overrideMaxTtlMs" }}
  NG__LOGGING__CONTROL__OVERRIDE_MAX_TTL_MS: {{ $config.logging.control.overrideMaxTtlMs | quote }}
  {{- end }}
  {{- if hasKey $config.logging.control "overrideCleanupIntervalMs" }}
  NG__LOGGING__CONTROL__OVERRIDE_CLEANUP_INTERVAL_MS: {{ $config.logging.control.overrideCleanupIntervalMs | quote }}
  {{- end }}
  {{- if hasKey $config.logging.control "ingestQueueCapacity" }}
  NG__LOGGING__CONTROL__INGEST_QUEUE_CAPACITY: {{ $config.logging.control.ingestQueueCapacity | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.logging.output }}
  {{- if $runtimeEnvEnabled }}
  {{- if hasKey $config.logging.output "format" }}
  NG__LOGGING__OUTPUT__FORMAT: {{ $config.logging.output.format | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output "includeSpanFields" }}
  NG__LOGGING__OUTPUT__INCLUDE_SPAN_FIELDS: {{ $config.logging.output.includeSpanFields | quote }}
  {{- end }}
  {{- if $config.logging.output.file }}
  {{- if hasKey $config.logging.output.file "enabled" }}
  NG__LOGGING__OUTPUT__FILE__ENABLED: {{ $config.logging.output.file.enabled | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output.file "dir" }}
  NG__LOGGING__OUTPUT__FILE__DIR: {{ $config.logging.output.file.dir | quote }}
  {{- end }}
  {{- if $config.logging.output.file.rotation }}
  {{- if hasKey $config.logging.output.file.rotation "mode" }}
  NG__LOGGING__OUTPUT__FILE__ROTATION__MODE: {{ $config.logging.output.file.rotation.mode | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output.file.rotation "time" }}
  NG__LOGGING__OUTPUT__FILE__ROTATION__TIME: {{ $config.logging.output.file.rotation.time | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output.file.rotation "sizeMb" }}
  NG__LOGGING__OUTPUT__FILE__ROTATION__SIZE_MB: {{ $config.logging.output.file.rotation.sizeMb | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output.file.rotation "maxFiles" }}
  NG__LOGGING__OUTPUT__FILE__ROTATION__MAX_FILES: {{ $config.logging.output.file.rotation.maxFiles | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.logging.output.file.retention }}
  {{- if hasKey $config.logging.output.file.retention "maxDays" }}
  NG__LOGGING__OUTPUT__FILE__RETENTION__MAX_DAYS: {{ $config.logging.output.file.retention.maxDays | quote }}
  {{- end }}
  {{- if hasKey $config.logging.output.file.retention "maxTotalSizeMb" }}
  NG__LOGGING__OUTPUT__FILE__RETENTION__MAX_TOTAL_SIZE_MB: {{ $config.logging.output.file.retention.maxTotalSizeMb | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.logging.cleanup }}
  {{- if $runtimeEnvEnabled }}
  {{- if hasKey $config.logging.cleanup "enabled" }}
  NG__LOGGING__CLEANUP__ENABLED: {{ $config.logging.cleanup.enabled | quote }}
  {{- end }}
  {{- if hasKey $config.logging.cleanup "intervalMs" }}
  NG__LOGGING__CLEANUP__INTERVAL_MS: {{ $config.logging.cleanup.intervalMs | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.web }}
  {{- if $config.web.routerPrefix }}
  NG__WEB__ROUTER_PREFIX: {{ $config.web.routerPrefix | quote }}
  {{- end }}
  {{- if $config.web.host }}
  NG__WEB__HOST: {{ $config.web.host | quote }}
  {{- end }}
  {{- if $config.web.port }}
  NG__WEB__PORT: {{ $config.web.port | quote }}
  {{- end }}
  {{- if hasKey $config.web "workers" }}
  NG__WEB__WORKERS: {{ $config.web.workers | quote }}
  {{- end }}
  {{- if $config.web.ssl }}
  {{- if hasKey $config.web.ssl "enabled" }}
  NG__WEB__SSL__ENABLED: {{ $config.web.ssl.enabled | quote }}
  {{- end }}
  {{- if $config.web.ssl.port }}
  NG__WEB__SSL__PORT: {{ $config.web.ssl.port | quote }}
  {{- end }}
  {{- if $config.web.ssl.type }}
  NG__WEB__SSL__TYPE: {{ $config.web.ssl.type | quote }}
  {{- end }}
  {{- if $config.web.ssl.cert }}
  NG__WEB__SSL__CERT: {{ $config.web.ssl.cert | quote }}
  {{- end }}
  {{- if $config.web.ssl.key }}
  NG__WEB__SSL__KEY: {{ $config.web.ssl.key | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.web.cors }}
  {{- if $config.web.cors.mode }}
  NG__WEB__CORS__MODE: {{ $config.web.cors.mode | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.web.jwt }}
  {{- if $config.web.jwt.secret }}
  NG__WEB__JWT__SECRET: {{ $config.web.jwt.secret | quote }}
  {{- end }}
  {{- if $config.web.jwt.expire }}
  NG__WEB__JWT__EXPIRE: {{ $config.web.jwt.expire | quote }}
  {{- end }}
  {{- if $config.web.jwt.issuer }}
  NG__WEB__JWT__ISSUER: {{ $config.web.jwt.issuer | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.cache }}
  {{- if $config.cache.type }}
  NG__CACHE__TYPE: {{ $config.cache.type | quote }}
  {{- end }}
  {{- if $config.cache.prefix }}
  NG__CACHE__PREFIX: {{ $config.cache.prefix | quote }}
  {{- end }}
  {{- if $config.cache.delimiter }}
  NG__CACHE__DELIMITER: {{ $config.cache.delimiter | quote }}
  {{- end }}
  {{- end }}
  {{- if $config.db }}
  {{- if $config.db.sqlite }}
  {{- if $config.db.sqlite.path }}
  NG__DB__SQLITE__PATH: {{ $config.db.sqlite.path | quote }}
  {{- end }}
  {{- if $config.db.sqlite.timeout }}
  NG__DB__SQLITE__TIMEOUT: {{ $config.db.sqlite.timeout | quote }}
  {{- end }}
  {{- if $config.db.sqlite.idleTimeout }}
  NG__DB__SQLITE__IDLE_TIMEOUT: {{ $config.db.sqlite.idleTimeout | quote }}
  {{- end }}
  {{- if $config.db.sqlite.maxLifetime }}
  NG__DB__SQLITE__MAX_LIFETIME: {{ $config.db.sqlite.maxLifetime | quote }}
  {{- end }}
  {{- if $config.db.sqlite.maxConnections }}
  NG__DB__SQLITE__MAX_CONNECTIONS: {{ $config.db.sqlite.maxConnections | quote }}
  {{- end }}
  {{- if hasKey $config.db.sqlite "autoCreate" }}
  NG__DB__SQLITE__AUTO_CREATE: {{ $config.db.sqlite.autoCreate | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}

