          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Write queue wait p95 (seconds)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le, channel_id, driver) (rate(ng_gateway_control_write_queue_wait_seconds_bucket{channel_id=~\"$channel_id\",driver=~\"$driver\"}[5m])))", "legendFormat": "{{ "{{" }}channel_id{{ "}}" }}/{{ "{{" }}driver{{ "}}" }}" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Write execute p95 (seconds) by result",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le, channel_id, driver, result) (rate(ng_gateway_control_write_execute_seconds_bucket{channel_id=~\"$channel_id\",driver=~\"$driver\"}[5m])))", "legendFormat": "{{ "{{" }}channel_id{{ "}}" }}/{{ "{{" }}driver{{ "}}" }}/{{ "{{" }}result{{ "}}" }}" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ng-gateway.fullname" . }}-grafana-dashboard-collector
  {{- with .Values.observability.grafanaDashboards.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "ng-gateway.gateway.labels" . | nindent 4 }}
    {{- with .Values.observability.grafanaDashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.observability.grafanaDashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  collector.json: |-
    {
      "title": "NG Gateway - Collector",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "timezone": "browser",
      "time": { "from": "now-5m", "to": "now" },
      "tags": ["ng-gateway", "collector"],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" }
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Collect cycles rate (by result) (/s)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "sum by (result) (rate(ng_gateway_collector_cycles_total[5m]))", "legendFormat": "{{ "{{" }}result{{ "}}" }}" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Collect cycle p95 (seconds) by result",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le, result) (rate(ng_gateway_collector_cycle_seconds_bucket[5m])))", "legendFormat": "{{ "{{" }}result{{ "}}" }}" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 }
        },
        {
          "type": "stat",
          "title": "Collector active tasks",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "ng_gateway_collector_active_tasks", "legendFormat": "active" }
          ],
          "gridPos": { "x": 0, "y": 16, "w": 8, "h": 6 }
        },
        {
          "type": "timeseries",
          "title": "Collector concurrency permits",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "expr": "ng_gateway_collector_concurrency_permits{state=\"current\"}", "legendFormat": "current" },
            { "expr": "ng_gateway_collector_concurrency_permits{state=\"available\"}", "legendFormat": "available" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 80, "gradientMode": "opacity", "showPoints": "never", "spanNulls": true } }, "overrides": [] },
          "gridPos": { "x": 8, "y": 16, "w": 16, "h": 6 }
        }
      ]
    }
{{- end }}

