          },
          {
            "name": "channel_id",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(ng_gateway_southward_channel_connected, channel_id)",
            "includeAll": true,
            "allValue": ".*",
