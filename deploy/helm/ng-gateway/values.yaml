# Default values for ng-gateway
# This is a YAML-formatted file.

# Global settings
global:
  # Image registry (leave empty to use default)
  imageRegistry: ""
  # Image pull policy
  imagePullPolicy: IfNotPresent
  # Image pull secrets (optional)
  imagePullSecrets: []
  # Storage class for PVCs. Set to non-empty value to create PVCs,
  # leave empty to fall back to emptyDir ephemeral storage.
  storageClass: ""

# Gateway service configuration
gateway:
  enabled: true
  # Runtime-editable settings env injection.
  #
  # When enabled, the Helm chart will inject a set of `NG__...` environment variables that
  # correspond to gateway runtime-editable settings (System Settings / runtime tuning).
  #
  # NOTE:
  # - The gateway backend marks those fields as `env_overridden` when the env var exists.
  # - If `enabled=true`, UI must treat those fields as read-only.
  # - Keep this disabled by default to let UI own runtime tuning.
  runtimeEnv:
    enabled: false
  # Image configuration
  image:
    registry: ""
    # Docker image repository (Docker Hub namespace/repo by default)
    repository: shiyuecamus/ng-gateway
    # Image tag. If empty, chart will default to `.Chart.AppVersion` for reproducible releases.
    tag: ""
    pullPolicy: ""
  
  # Replica count
  replicaCount: 1
  
  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  
  # Pod annotations
  podAnnotations: {}
  
  # Pod security context
  # Example:
  # podSecurityContext:
  #   fsGroup: 1000
  #   runAsNonRoot: true
  #   runAsUser: 1000
  podSecurityContext: {}
  
  # Container security context
  # Example:
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  #   readOnlyRootFilesystem: false
  #   runAsNonRoot: true
  #   runAsUser: 1000
  securityContext: {}
  
  # Resource limits and requests
  # Example:
  # resources:
  #   limits:
  #     cpu: 2000m
  #     memory: 2Gi
  #   requests:
  #     cpu: 500m
  #     memory: 512Mi
  resources: {}
  
  # Liveness and readiness probes
  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  # Startup probe
  startupProbe:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  
  # Service configuration
  # Ports are automatically read from gateway.config.web.port and gateway.config.web.ssl.port
  service:
    type: ClusterIP
    httpPort: 5678
    httpsPort: 5679
    annotations: {}
    # For NodePort/LoadBalancer
    nodePort:
      http: 30080
      https: 30443
  
  # Gateway configuration (will be converted to ConfigMap environment variables)
  # All values are automatically converted to strings and prefixed with NG__ where applicable
  config:
    # Logging configuration
    logLevel: "info"
    timezone: "Asia/Shanghai"
    
    # General configuration
    general:
      # Runtime root directory. All relative paths (./data, ./drivers, ./plugins, ./certs, ...)
      # are resolved under this directory.
      #
      # Recommendation for this Helm chart:
      # - Keep it as "." because the gateway container image uses WORKDIR=/app.
      runtimeDir: "."
      # CA cert/key file names under ./certs (resolved under runtime root).
      caCertPath: "ca.crt"
      caKeyPath: "ca.key"
      
      # Southward communication configuration
      southward:
        # milliseconds
        startTimeoutMs: 5000
        # Device snapshot TTL GC (point-level baseline eviction).
        #
        # Point baseline TTL in milliseconds. 0 disables eviction.
        deviceChangeCacheTtlMs: 600000
        # Snapshot GC scan interval in milliseconds.
        snapshotGcIntervalMs: 60000
        # Number of async snapshot GC workers.
        snapshotGcWorkers: 2
        # Max devices to scan per snapshot GC tick.
        maxDevicesPerSnapshotTick: 256
      
      # Northward communication configuration
      northward:
        queueCapacity: 10000
        # milliseconds
        startTimeoutMs: 5000
      
      # Collector configuration
      collector:
        # milliseconds
        collectionTimeoutMs: 30000
        maxConcurrentCollections: 200
        outboundQueueCapacity: 10000
        retryPolicy:
          maxAttempts: 3
          initialIntervalMs: 1000
          maxIntervalMs: 30000
          randomizationFactor: 0.2
          multiplier: 2.0
          maxElapsedTimeMs: 5000
    
    # Logging configuration (top-level)
    logging:
      control:
        overrideDefaultTtlMs: 300000
        overrideMinTtlMs: 10000
        overrideMaxTtlMs: 1800000
        overrideCleanupIntervalMs: 5000
        ingestQueueCapacity: 10000
      output:
        format: "text"               # text | json
        includeSpanFields: true
        file:
          enabled: true
          dir: "./logs"
          rotation:
            mode: "both"             # time | size | both
            time: "daily"            # hourly | daily
            sizeMb: 100
            maxFiles: 200
          retention:
            maxDays: 7
            maxTotalSizeMb: 2048
      cleanup:
        enabled: true
        intervalMs: 60000
    
    # Web configuration
    web:
      routerPrefix: "/api"
      host: "0.0.0.0"
      port: 5678
      # 0 = use CPU count, >0 = exact number, <0 = CPU count / abs(workers)
      workers: 0

      # SSL configuration
      ssl:
        enabled: true
        port: 5679
        # auto: generate or load from ca_cert_path and ca_key_path, local: load from cert and key
        type: "auto"
        cert: "./certs/cert.pem"
        key: "./certs/key.pem"
      
      # CORS configuration
      cors:
        # allow_all, whitelist
        mode: "allow_all"
        whitelist:
          origins:
            - "*"
          methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
          headers:
            - "Content-Type"
            - "AccessToken"
            - "X-CSRF-Token"
            - "Authorization"
            - "Token"
            - "X-Token"
            - "X-User-Id"
          exposeHeaders:
            - "Content-Length"
            - "Access-Control-Allow-Origin"
            - "Access-Control-Allow-Headers"
            - "Content-Type"
          credentials: true
      
      # JWT configuration
      jwt:
        secret: "ng-gateway"
        # milliseconds
        expire: 3600000
        issuer: "ng-gateway"
    
    # Network management configuration
    network:
      # Enable network management module (interface enumeration, Wi-Fi, AP hotspot).
      enabled: true
      # AP hotspot configuration
      ap:
        # Enable AP hotspot on startup.
        enabled: true
        # Default SSID. {MAC4} is replaced with last 4 hex digits of Wi-Fi MAC address.
        ssid: "NG-Gateway-{MAC4}"
        # WPA2 password (8-63 characters).
        password: "ng-gateway"
        # 2.4GHz channel (1-13). 0 = auto selection.
        channel: 0
        # AP interface IP address.
        ip: "10.47.0.1"
        # Subnet prefix length.
        prefixLength: 24
        # DHCP range start for connected clients.
        dhcpRangeStart: "10.47.0.10"
        # DHCP range end for connected clients.
        dhcpRangeEnd: "10.47.0.200"
        # DHCP lease time.
        dhcpLeaseTime: "12h"

    # Cache configuration
    cache:
      # only moka is supported
      type: "moka"
      prefix: "ng-gateway"
      delimiter: ":"
    
    # Database configuration
    db:
      sqlite:
        # Final path resolves under ./data
        path: "ng-gateway.db"
        # milliseconds
        timeout: 5000
        # milliseconds
        idleTimeout: 5000
        # milliseconds
        maxLifetime: 5000
        # number of connections
        maxConnections: 100
        # auto create database file and directory if not exists
        autoCreate: true
  
  # Additional environment variables from secrets (optional)
  envFromSecrets: []
  
  # Node selector
  # Example:
  # nodeSelector:
  #   kubernetes.io/os: linux
  #   node-role.kubernetes.io/worker: "true"
  nodeSelector: {}
  
  # Tolerations
  # Example:
  # tolerations:
  #   - key: "key1"
  #     operator: "Equal"
  #     value: "value1"
  #     effect: "NoSchedule"
  #   - key: "key2"
  #     operator: "Exists"
  #     effect: "NoExecute"
  tolerations: []
  
  # Affinity
  # Example:
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           labelSelector:
  #             matchExpressions:
  #               - key: app.kubernetes.io/component
  #                 operator: In
  #                 values:
  #                   - gateway
  #           topologyKey: kubernetes.io/hostname
  affinity: {}
  
  # Pod disruption budget
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

# Persistent Volume Claims
persistence:
  # Gateway data persistence
  gatewayData:
    enabled: true
    # Set storageClass (or global.storageClass) to provision a PVC.
    # Leave empty to use emptyDir for temporary storage.
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
  
  # Gateway drivers persistence
  gatewayDrivers:
    enabled: true
    # Requires storageClass/global.storageClass to create a PVC.
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    annotations: {}
  
  # Gateway plugins persistence
  gatewayPlugins:
    enabled: true
    # Requires storageClass/global.storageClass to create a PVC.
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    annotations: {}

# Ingress configuration
# All-in-one mode: gateway serves both UI and API, so Ingress routes `/` to gateway service.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: gateway.example.com
  tls: []
  #  - secretName: gateway-tls
  #    hosts:
  #      - gateway.example.com

# Observability "one-click" bundle.
# This does NOT install Prometheus/Grafana for you.
# It only creates Kubernetes resources (ServiceMonitor/PodMonitor/PrometheusRule/Dashboard ConfigMaps)
# that are typically consumed by Prometheus Operator + Grafana sidecar (kube-prometheus-stack).
observability:
  enabled: false

  # Prometheus Operator selectors often require a label match (kube-prometheus-stack defaults to `release=<helm release>`).
  # Set selectorLabelValue to your kube-prometheus-stack release name, e.g. "kube-prometheus-stack" or "monitoring".
  prometheusOperator:
    selectorLabelKey: release
    selectorLabelValue: "kube-prometheus-stack"

  # Scraping configuration (choose ONE: ServiceMonitor or PodMonitor).
  scrape:
    kind: ServiceMonitor # ServiceMonitor | PodMonitor
    interval: 5s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    metricRelabelings: []
    relabelings: []

  # Grafana dashboards provisioning via ConfigMaps (for Grafana sidecar).
  grafanaDashboards:
    enabled: true
    # Optional: create dashboard ConfigMaps in a different namespace (e.g. the Grafana namespace).
    # Requires Helm to have RBAC permission to create ConfigMaps in that namespace.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    annotations: {}

  # PrometheusRule alerts (requires Prometheus Operator).
  alerts:
    enabled: true
    labels: {}
    annotations: {}
    # Default alert thresholds (tune per deployment).
    thresholds:
      queueSaturationRatio: 0.8
      dropsPerSecond: 0.1
      blockedP95Seconds: 0.2
      reconnectPerMinute: 10
      publishSuccessRate: 0.95

# NetworkPolicy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Name of the Kubernetes secret containing image pull credentials
imagePullSecrets: []

# Name override for the chart
nameOverride: ""

# Full name override for the chart
fullnameOverride: ""

