# Default gateway config for Homebrew single-machine distribution (macOS).
#
# Key differences vs repo root `gateway.toml`:
# - UI uses `embedded_zip` so the Homebrew-installed binary can serve UI without filesystem dist.
#
# Note:
# - Many file paths are relative to the current working directory.
# - Homebrew wrapper will `cd` into `var/lib/ng-gateway` before launching.

# General
[general]
#
# Homebrew best practice:
# - The wrapper will `cd` into `var/lib/ng-gateway` before launching, so keep this as "."
runtime_dir = "."
ca_cert_path = "ca.crt"
ca_key_path = "ca.key"

[general.southward]
start_timeout_ms = 2000

[general.southward.snapshot]
device_change_cache_ttl_ms = 600000
gc_interval_ms = 60000
gc_workers = 2
max_devices_per_tick = 256

[general.northward]
queue_capacity = 10000
start_timeout_ms = 2000

[general.collector]
collection_timeout_ms = 30000
metrics_interval_ms = 60000
max_concurrent_collections = 200
retry_attempts = 3
retry_delay_ms = 1000
outbound_queue_capacity = 10000

# Logging
[general.logging]
# Default TTL for channel log level overrides in milliseconds.
# Environment override: NG__LOGGING__CHANNEL_OVERRIDE_DEFAULT_TTL_MS
channel_override_default_ttl_ms = 300000
# Minimum allowed TTL (ms) to avoid abusive rapid toggling.
# Environment override: NG__LOGGING__CHANNEL_OVERRIDE_MIN_TTL_MS
channel_override_min_ttl_ms = 10000
# Maximum allowed TTL (ms) to avoid "permanent debug".
# Environment override: NG__LOGGING__CHANNEL_OVERRIDE_MAX_TTL_MS
channel_override_max_ttl_ms = 1800000
# Override cleanup tick interval in milliseconds.
# Environment override: NG__LOGGING__OVERRIDE_CLEANUP_INTERVAL_MS
override_cleanup_interval_ms = 5000
# Driver->host log ingest queue capacity (bounded, drop-old-keep-new).
# Environment override: NG__LOGGING__DRIVER_INGEST_QUEUE_CAPACITY
driver_ingest_queue_capacity = 10000

# Web
[web]
router_prefix = "/api"
host = "0.0.0.0"
port = 8978
workers = 0

[web.ui]
enabled = true
# Mode: embedded_zip | filesystem | disabled
mode = "embedded_zip"
filesystem_root = "./ng-gateway-ui/apps/web-antd/dist"

[web.ssl]
enabled = true
port = 8979
type = "auto"
cert = "./certs/cert.pem"
key = "./certs/key.pem"

[web.cors]
mode = "allow_all"

[web.cors.whitelist]
origins = ["*"]
methods = ["GET", "POST", "PUT", "DELETE"]
headers = [
  "Content-Type",
  "AccessToken",
  "X-CSRF-Token",
  "Authorization",
  "Token",
  "X-Token",
  "X-User-Id",
]
expose_headers = [
  "Content-Length",
  "Access-Control-Allow-Origin",
  "Access-Control-Allow-Headers",
  "Content-Type",
]
credentials = true

[web.jwt]
secret = "ng-gateway"
expire = 3600000
issuer = "ng-gateway"

# Cache
[cache]
type = "moka"
prefix = "ng-gateway"
delimiter = ":"

# Database
[db.sqlite]
path = "ng-gateway.db"
timeout = 5000
idle_timeout = 5000
max_lifetime = 5000
max_connections = 100
auto_create = true


